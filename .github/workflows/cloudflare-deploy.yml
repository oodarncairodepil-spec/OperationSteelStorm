name: Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-web:
    name: Build Web Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Godot export dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Build Cloudflare Pages web output
        env:
          SIGNALING_URL: ${{ vars.SIGNALING_URL }}
          SIGNALLING_URL: ${{ vars.SIGNALLING_URL }}
          WASM_PUBLIC_URL: ${{ vars.WASM_PUBLIC_URL }}
        run: npm run cf:pages:build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: game/web/

  deploy-worker:
    name: Deploy Signaling Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/signaling-worker/package-lock.json

      - name: Install worker dependencies
        run: npm --prefix cloudflare/signaling-worker ci

      - name: Typecheck signaling worker
        run: npm --prefix cloudflare/signaling-worker run typecheck

      - name: Deploy signaling worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --config cloudflare/signaling-worker/wrangler.jsonc

  deploy-pages:
    name: Deploy Cloudflare Pages Assets
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: game/web

      - name: Publish Pages static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy game/web --project-name operation-steelstorm-game
