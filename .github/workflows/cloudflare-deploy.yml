name: Cloudflare Worker Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-worker:
    name: Deploy Signaling Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/signaling-worker/package-lock.json

      - name: Install worker dependencies
        run: npm --prefix cloudflare/signaling-worker ci

      - name: Typecheck signaling worker
        run: npm --prefix cloudflare/signaling-worker run typecheck

      - name: Deploy signaling worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --config cloudflare/signaling-worker/wrangler.jsonc
