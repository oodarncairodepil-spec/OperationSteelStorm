name: Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-worker:
    name: Deploy Signaling Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/signaling-worker/package-lock.json

      - name: Install worker dependencies
        run: npm --prefix cloudflare/signaling-worker ci

      - name: Typecheck signaling worker
        run: npm --prefix cloudflare/signaling-worker run typecheck

      - name: Deploy signaling worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --config cloudflare/signaling-worker/wrangler.jsonc

  deploy-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    env:
      SIGNALING_URL: ${{ secrets.CLOUDFLARE_SIGNALING_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Godot web export
        run: npm run cf:pages:build

      - name: Deploy static site to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy game/web --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
