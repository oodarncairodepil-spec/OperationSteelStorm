services:
  signaling:
    build: ../signaling-server
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      MAX_PLAYERS_PER_ROOM: "2"
      LOG_LEVEL: "info"
    restart: unless-stopped

  # Optional static file server for local Web export smoke tests.
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../game/web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - signaling
    profiles:
      - web
