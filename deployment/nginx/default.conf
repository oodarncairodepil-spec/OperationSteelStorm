server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index operation-steelstorm.html index.html;

    location / {
        try_files $uri $uri/ /operation-steelstorm.html;
    }

    location ~* \.(wasm|pck|js)$ {
        add_header Cache-Control "public, max-age=3600";
        types {
            application/wasm wasm;
            application/octet-stream pck;
        }
    }

    # Godot web games often need correct MIME for .wasm
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
